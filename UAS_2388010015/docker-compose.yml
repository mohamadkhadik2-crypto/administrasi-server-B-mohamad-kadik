version: '3.8'

services:
  # Database MariaDB
  db:
    image: mariadb:10.5
    container_name: db_uas
    restart: always
    environment:
      MYSQL_DATABASE: db_aplikasi
      MYSQL_ROOT_PASSWORD: password_aman
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Web Dinamis (Python Flask)
  web_dinamis:
    build: .
    container_name: web_dinamis
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
